name: Ops digest

# Every hour: pull the important lines and the money state out of the VM,
# commit them to the ops-digest branch (never main, so nothing deploys),
# and carry any escalation the cloud routine left on that branch DOWN to
# the VM, where the bot sends it on Telegram at its next guard pass. Zero
# new secrets: the same service account the heartbeat uses.
# Proven by hand first (two dispatches: the pull, then a synthetic verdict
# carried down and sent). Scheduled hourly: the cloud routine's push of
# ops/verdict.json did NOT fire the push trigger on 2026-09-12 (the routine
# pushes through the Claude GitHub app), so the hourly cron is the carrier;
# the push trigger stays in case it starts firing.
on:
  schedule:
    - cron: "17 * * * *"
  # Second carrier: the heartbeat's own schedule does fire on this repo
  # (a handful of times a day); ride its completions too. Neither the 19:17
  # nor the 20:17 slot fired on 2026-09-12.
  workflow_run:
    workflows: ["Heartbeat"]
    types: [completed]
  push:
    branches: [ops-digest]
    paths: [ops/verdict.json]
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours of log to include"
        default: "24"

concurrency:
  group: ops-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare the ops-digest branch
        run: |
          git config user.name "ops-digest"
          git config user.email "ops-digest@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ops-digest >/dev/null 2>&1; then
            git fetch origin ops-digest
            git checkout -B ops-digest origin/ops-digest
          else
            git checkout --orphan ops-digest
            git rm -rf -q . || true
            mkdir -p ops
            echo "# ops digest branch" > ops/README.md
            git add ops && git commit -q -m "ops: start the digest branch"
            git push -q origin ops-digest
          fi
          mkdir -p ops

      - name: Carry any new verdict down to the VM (escalation or fix, once per id)
        run: |
          set +e
          if [ -f ops/verdict.json ]; then
            KIND=$(python3 -c "import json;print(json.load(open('ops/verdict.json')).get('kind',''))" 2>/dev/null)
            VID=$(python3 -c "import json;print(json.load(open('ops/verdict.json')).get('id',''))" 2>/dev/null)
            LAST=$(cat ops/.delivered 2>/dev/null || echo "")
            if { [ "$KIND" = "escalation" ] || [ "$KIND" = "fix" ]; } && [ -n "$VID" ] && [ "$VID" != "$LAST" ]; then
              # The SSH user is the service account's, not the app's, so the
              # data dir is not writable from the shell: copy INTO the
              # container instead (docker cp lands as root, 644, which the
              # bot can read and rename).
              if gcloud compute scp ops/verdict.json poly-poly-bot:/tmp/ops-escalation.json \
                   --zone=asia-northeast1-a --project=roman-vm --tunnel-through-iap --quiet \
                 && gcloud compute ssh poly-poly-bot --zone=asia-northeast1-a --project=roman-vm --tunnel-through-iap --quiet \
                      --command='docker cp /tmp/ops-escalation.json poly-poly-bot:/app/data/ops-escalation.json && rm -f /tmp/ops-escalation.json'; then
                echo "$VID" > ops/.delivered && echo "delivered $KIND $VID"
              else
                echo "::error::could not carry verdict $VID down to the VM; it will be retried next run"
              fi
            fi
          fi
          set -e

      - name: Pull the digest out of the VM
        run: |
          HOURS="${{ github.event.inputs.hours || '24' }}"
          # The SSH tunnel can hand back CRLF; strip it before the anchors.
          cut() { tr -d '\r' | sed -n '/^@@OPS_DIGEST_BEGIN@@$/,/^@@OPS_DIGEST_END@@$/p' | sed '1d;$d'; }
          gcloud compute ssh poly-poly-bot --zone=asia-northeast1-a --project=roman-vm --tunnel-through-iap --quiet \
            --command="docker exec poly-poly-bot python scripts/ops_digest.py --hours $HOURS" 2>/dev/null | cut > ops/latest.md
          gcloud compute ssh poly-poly-bot --zone=asia-northeast1-a --project=roman-vm --tunnel-through-iap --quiet \
            --command="docker exec poly-poly-bot python scripts/ops_digest.py --hours $HOURS --json" 2>/dev/null | cut > ops/state.json
          if ! python3 -c "import json;json.load(open('ops/state.json'))"; then
            echo "::error::state.json is not valid json (the container may predate the sentinels)"; exit 1
          fi
          echo "state.json valid"
          DAY=$(date -u +%F)
          cp ops/latest.md "ops/digest-$DAY.md"
          # keep two weeks of daily files
          ls -1 ops/digest-*.md 2>/dev/null | sort | head -n -14 | xargs -r git rm -q --ignore-unmatch
          wc -l ops/latest.md

      - name: Commit and push
        run: |
          git add -A ops
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "ops: digest $(date -u +%FT%TZ)"
          # The routine writes to the same branch: never push on a stale base.
          git pull --rebase -q origin ops-digest || true
          git push -q origin ops-digest
