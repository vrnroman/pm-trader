name: Deploy

# Two ways in:
#   * Auto-deploy on merge — every push to main runs the test gate and, if it
#     passes, deploys to the GCP VM. Merging a PR ships it.
#   * Manual button — Actions -> Deploy -> Run workflow (e.g. from the GitHub
#     mobile app) to deploy on demand, with an optional skip-tests escape hatch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the full test suite before deploying"
        type: boolean
        default: true

concurrency:
  # never let two deploys race onto the same VM
  group: deploy-poly-poly-bot
  cancel-in-progress: false

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    # Always gate auto-deploys (push); on a manual run honour the run_tests
    # toggle so the skip-tests escape hatch still works.
    if: ${{ github.event_name == 'push' || inputs.run_tests }}
    defaults:
      run:
        working-directory: poly_poly_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff freezegun
      - name: Lint (ruff F821 — undefined names)
        run: ruff check --select F821 src main.py
      - name: Full test suite
        run: python -m pytest tests/ -q
      - name: Clock-drift suite (no test may depend on the wall clock)
        run: CLOCK_DRIFT_DAYS=90 python -m pytest tests/ -q -p tests.clock_drift_plugin

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    # run after the gate; `always() && !failure()` lets deploy proceed when the
    # test job is *skipped* (run_tests=false) but blocks it if tests actually fail
    needs: [test]
    if: ${{ always() && needs.test.result != 'failure' && needs.test.result != 'cancelled' }}
    defaults:
      run:
        working-directory: poly_poly_bot
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Materialize .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Owner credential sources (2026-10-25): individual Actions secrets,
          # injected into .env below name-only. Absent = source logs off.
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_LIST_ID: ${{ secrets.X_LIST_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is empty — add it in repo Settings > Secrets"
            exit 1
          fi
          printf '%s' "$ENV_FILE" > .env
          echo "wrote .env ($(wc -l < .env) lines)"
          # The copy bot was removed on 2026-10-27 and nothing in this build
          # can sign an order: the wallet's private key is not shipped to the
          # VM at all (it stays in the ENV_FILE secret). Name-only echo.
          for k in PRIVATE_KEY; do
            if grep -q "^$k=" .env; then sed -i "/^$k=/d" .env; echo "  - $k dropped (not used)"; fi
          done

          # Owner credential sources: name-only echo, value never logged. A key
          # the ENV_FILE secret already defines wins (2026-10-25).
          put_secret() {
            if grep -q "^$1=" .env; then
              echo "  = $1 kept from ENV_FILE secret"
            elif [ -n "$2" ]; then
              printf '%s=%s\n' "$1" "$2" >> .env
              echo "  + $1 set from Actions secret (news source)"
            else
              echo "  - $1 unset (source stays off)"
            fi
          }
          put_secret X_AUTH_TOKEN "$X_AUTH_TOKEN"
          put_secret X_CT0 "$X_CT0"
          put_secret X_LIST_ID "$X_LIST_ID"
          put_secret TELEGRAM_API_ID "$TELEGRAM_API_ID"
          put_secret TELEGRAM_API_HASH "$TELEGRAM_API_HASH"
          put_secret TELEGRAM_USER_SESSION "$TELEGRAM_USER_SESSION"
          put_secret CLAUDE_CODE_OAUTH_TOKEN "$CLAUDE_CODE_OAUTH_TOKEN"

          # News bot defaults, appended only when the secret does not set them
          # (docker --env-file takes the last value; the secret stays the
          # source of truth).
          ensure_env() {
            if ! grep -q "^$1=" .env; then
              printf '\n%s=%s\n' "$1" "$2" >> .env
              echo "  + $1=$2 (deploy default)"
            else
              echo "  = $1 kept from secret"
            fi
          }
          ensure_env NEWS_STAKE_USD 5
          ensure_env NEWS_JUDGE_MODEL claude-sonnet-5-5
          ensure_env NEWS_LLM_DAILY_BUDGET 300
          ensure_env NEWS_DOMAINS politics,crypto,geo,corp
          ensure_env NEWS_MIN_PRICE 0.05
          ensure_env NEWS_MAX_PRICE 0.95

      # deploy.sh builds the image HERE on the runner (native amd64, fast,
      # already GCP-authed), PUSHES it to Artifact Registry, and the VM PULLS it
      # over Google's internal network — the VM never builds and never receives
      # a tarball over IAP. This replaces the old build-on-VM path (40-min
      # CPU-starved build, 2026-06-15) and the interim save|gzip→scp→load path
      # (~10-min IAP transfer). GitHub-hosted runners ship Docker + BuildKit,
      # and the CI SA has artifactregistry.writer, so no extra setup step.
      - name: Build image + push to AR + deploy (IAP tunnel)
        env:
          DEPLOY_USE_IAP: "1"
          DOCKER_BUILDKIT: "1"
          # the Linux user whose ~/app holds the live deployment (repo variable,
          # not a secret); must match your local deploy user so data persists
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: bash deploy.sh

      - name: Scrub secrets from runner
        if: always()
        run: rm -f .env
