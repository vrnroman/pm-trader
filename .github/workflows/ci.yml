name: CI

# The gate that runs BEFORE a merge, and on a clock.
#
# `Deploy` already runs the same suite on every push to main — but only there,
# which left two holes this fills:
#   * a pull request got no checks at all, so red arrived after the merge;
#   * nothing ran between pushes, so a test that rots with the calendar sat
#     undetected until whoever pushed next wore the failure. That is exactly
#     how 2026-09-14 went: the suite went red with no commit behind it, and
#     the next merge inherited the blame.
#
# Deliberately a separate workflow from `Deploy`, not a `pull_request` trigger
# bolted onto it: that workflow's second job ships to the VM, and a trigger
# there would put unmerged branch code on the box. Nothing here can deploy.
on:
  pull_request:
  schedule:
    # 03:17 UTC daily — a rotted suite announces itself within a day, attributed
    # to the calendar rather than to the next person who pushes. Off the hour on
    # purpose; :00 is when every cron on the platform wakes up at once.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # A new push to a PR supersedes the run in flight; never cancel a nightly.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poly_poly_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff F821 — undefined names)
        run: ruff check --select F821 src main.py
      - name: Full test suite
        run: python -m pytest tests/ -q

  clock-drift:
    name: Clock drift (+90d, +400d)
    runs-on: ubuntu-latest
    # The time-bomb sweep: run the whole suite as if it were months from now.
    # A test that passes today and fails under the shift is pinned to the
    # calendar, and would have gone red on its own some morning with no commit
    # to blame. freezegun is installed inline (like ruff) rather than added to
    # requirements.txt, which is also the production image's dependency list.
    defaults:
      run:
        working-directory: poly_poly_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt freezegun
      - name: Suite at +90 days
        env:
          CLOCK_DRIFT_DAYS: "90"
        run: python -m pytest tests/ -q -p tests.clock_drift_plugin
      - name: Suite at +400 days
        env:
          CLOCK_DRIFT_DAYS: "400"
        run: python -m pytest tests/ -q -p tests.clock_drift_plugin
